}

:root[data-theme="dark"]{
 --bg:#0f1220;--surface:#171b2e;--ink:#e8ebf7;--ink2:#a9b0cc;--ink3:#8b92b0;--line:#2a3050;--accent:#8da0ff;--accent-ink:#0f1220;
 --warn:#ff8a78;--good:#59d3a1;--wash:#1f2440;--w:#e0b050;--h:#59d3a1;--e:#8fa8ff;--t:#f08cc6;color-scheme:dark}
*{box-sizing:border-box}

/* Visual refresh: warm, editorial game-board styling with lightweight motion. */
:root{--bg:#f4f1e9;--surface:#fffdf8;--ink:#20243a;--ink2:#596078;--ink3:#747b91;--line:#e2dccf;--accent:#4d5bd4;--accent-ink:#fff;--warn:#c44e3f;--good:#19856d;--wash:#efecff;--w:#c28a28;--h:#209b7b;--e:#5869dc;--t:#cb5b9b}

:root[data-theme="dark"]{--bg:#101426;--surface:#191f35;--ink:#f2f3fb;--ink2:#b4bdd5;--ink3:#8994b5;--line:#2c3554;--accent:#9ba7ff;--accent-ink:#151a2b;--warn:#ff8978;--good:#62d9b1;--wash:#242a49;--w:#f0bf59;--h:#62d9b1;--e:#a3b0ff;--t:#f49bcf;color-scheme:dark}
body{background:radial-gradient(ellipse at 90% 0%,rgba(111,125,235,.12),transparent 34%),var(--bg);transition:background-color .25s,color .25s}

.hero{grid-template-columns:minmax(0,1fr) minmax(270px,.92fr);gap:clamp(16px,3vw,30px);overflow:hidden;position:relative}

.hero-kicker:before{content:"";width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 15%,transparent)}
.home-step{position:relative;overflow:hidden;min-height:112px}
.home-step .step-no{font:800 2rem var(--f-display);color:var(--accent);opacity:.72;line-height:1}
.home-step p{max-width:30ch}
.chip{border-radius:999px}
.fill{transform-origin:left;animation:bar-grow .7s cubic-bezier(.2,.75,.2,1) both}

.life-road{stroke-dasharray:7 9;animation:road-dash 22s linear infinite}

/* Photo-led visual pass: real documentary images give the life paths a human scale. */
.hero-photos{position:relative;min-height:300px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.25fr .85fr;grid-template-rows:1fr 1fr;gap:8px;background:var(--wash);padding:8px}

function cumulativePanel(life){

 else items.push([`Skills ${Math.round(st.E)}/100 · ${Math.max(0,Math.ceil(45-st.E))} to threshold`,'The model uses 45 skills points as a simplified formal-work threshold. Studying still helps below it.','bad']);

}

function shuffledHouseholds(rng){const a=HOUSEHOLD_IDS.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function randomProfile(rng,cohort,householdId){
 const q=1+Math.floor(rng()*5), hid=householdId||HOUSEHOLD_IDS[Math.floor(rng()*HOUSEHOLD_IDS.length)],house=HOUSEHOLDS[hid];
 return {q,g:rng()<.5?'F':'M',place:house.place,reg:house.reg,caste:rng()<.35+.08*(3-q)?1:0,cohort:cohort||'ABCD'[Math.floor(rng()*4)],house:hid};
}
function initState(pr){
 const W0=[6,14,26,44,70][pr.q-1],h=HOUSEHOLDS[pr.house]||HOUSEHOLDS.farm;
 return {W:clamp(W0+h.W,-10,100),H:clamp(62+3*(pr.q-3)+(pr.reg==='S'?3:0)+(pr.place==='U'?2:0)-(pr.caste?2:0)+h.H,0,100),
  E:clamp(10+2*(pr.q-1)+h.E,0,100),T:clamp(50+(pr.place==='R'?4:0)+h.T,0,100),P:0,scars:0,chronic:0,widowed:false,place:pr.place,alive:true,deathAge:null,own:0,indep:null,kidEdu:0};
}
function polAt(polSched,ph){const o={};for(const k in POLICIES){o[k]=polSched[k]!=null&&polSched[k]<=ph;}return o;}
function access(st,pr,pol,per){
 let a=(st.place==='U'?1.0:.88)*(pr.reg==='S'?1.04:.94)*(pr.q<=2?.90:pr.q>=4?1.08:1)*(pr.g==='F'&&pr.reg==='N'?.94:1);
 if(pol.uhc)a=Math.max(a,1.05);
 return a+(per.access||0);
}

/* ---------- actions (pure calc) ---------- */
function calc(id,st,pr,pol,per,ph,u){
 const mods=[],d={W:0,H:0,E:0,T:0,P:0},ex={};
 const M=(l,m)=>{mods.push({label:l,m});return m;};
 switch(id){
 case 'study':{
  const base=[8,12,9,5,2,1][ph],cost=[1,6,4,3,1,0][ph];let m=1;
  const hh=HOUSEHOLDS[pr.house];if(hh){const accessFactor=(st.place==='R'?.85:1)*hh.study;m*=M(hh.studyLabel,accessFactor);}
  if(pr.caste&&!pol.scholar)m*=M('Caste-related access barrier (illustrative)',.90);
  if(pr.g==='F'&&!pol.girls){const x=pr.reg==='N'?.94:.98;m*=M('Gendered access barrier (illustrative)',x);}
  if(pr.q<=2&&!(pol.child&&ph<=1))m*=M('Low-resource learning gap (illustrative)',.88);
  if(per.study)m*=M('Era effect',per.study);
  d.E=base*m*(1-st.E/120);
  d.W=((pol.child&&ph<=1&&pr.q<=3)||(pol.scholar&&ph===1&&pr.q<=2))?0:-cost;break;}
 case 'work':{
  if(ph===0){d.W=pr.g==='M'?3:1;d.E=-3;d.H=-2;ex.child=true;break;}
  let gm=1,cm=1,pm=1,ag=1;
  if(pr.g==='F'&&!pol.girls)gm=M('Gendered work-access barrier (illustrative)',pr.reg==='N'?.90:.96);
  if(pr.caste&&!pol.scholar)cm=M('Caste-related hiring barrier (illustrative)',.92);
  if(st.place==='U')pm=M('Urban labour-market access (illustrative)',1.08);
  if(ph===3)ag=M('Ageism',.95);
  if(ph===4)ag=M('Age and health-related work limits (illustrative)',.80*clamp(st.H/70,.4,1));
  if(ph===5)ag=M('Age and health-related work limits (illustrative)',.55*clamp(st.H/70,.3,1));
  const score=st.E+(st.place==='U'?8:0)-(pr.caste&&!pol.scholar?8:0)-(pr.g==='F'&&!pol.girls?6:0)+(per.formal||0);
  const pf=ph<=3?1/(1+Math.exp(-(score-48)/8)):0;
  const formal=u<pf;
  const hh=HOUSEHOLDS[pr.house];if(hh&&hh.work!==1)M(hh.workLabel,hh.work);let inc=(7+.13*st.E)*gm*cm*pm*ag*(per.work||1)*(hh?hh.work:1);
  ex.pFormal=pf;ex.formal=formal;ex.incInformal=inc;
  if(formal)inc*=1.4;
  d.W=inc;d.H=-(st.E<35?2:1);if(formal)d.P=.2;break;}
 case 'invest':{
  const hh=HOUSEHOLDS[pr.house],sm=hh&&hh.save!==1?M(hh.saveLabel,hh.save):1;
  const debtDrag=st.W<0?Math.min(1.8,1+Math.abs(st.W)/50):1;
  if(st.W<0)mods.push({label:'Debt limits saving returns',m:+(1/debtDrag).toFixed(2)});
  d.W=ph===0?0:Math.max(.25,.08*Math.max(st.W,0)*sm/debtDrag);break;}
 case 'health':{
  const a=access(st,pr,pol,per);mods.push({label:'Access to care',m:+a.toFixed(2)});
  const hh=HOUSEHOLDS[pr.house];if(hh&&hh.care!==1)mods.push({label:hh.careLabel,m:hh.care});d.H=8*a*(1-st.H/125)*(hh?hh.care:1);d.W=pol.uhc?0:-(ph===0?.5:2);break;}
 case 'nurture':{
  const hh=HOUSEHOLDS[pr.house],tm=hh&&hh.ties!==1?M(hh.tiesLabel,hh.ties):1;
  d.T=9*(1-st.T/130)*tm;d.W=ph>=1?1.2*st.T/50*(hh?hh.ties:1):0;break;}
 }
 return {d,mods,ex};
}
function applyDelta(st,d){
 st.W=clamp(st.W+(d.W||0),-40,300);st.H=clamp(st.H+(d.H||0),0,100);
 st.E=clamp(st.E+(d.E||0),0,100);st.T=clamp(st.T+(d.T||0),0,100);st.P=clamp(st.P+(d.P||0),0,1);
}

/* ---------- life object ---------- */
function newLife(pr,seed,polSched){
 const life={pr,seed,polSched:polSched||{},st:initState(pr),phase:0,hist:[],actions:[],choices:{},reports:[],done:false,widowSeen:false,echoSeen:{}};
 life.hist.push(snap(life.st));return life;
}
const snap=s=>({W:s.W,H:s.H,E:s.E,T:s.T,P:s.P});
function perFor(life,ph){
 const card=PERIOD[life.pr.cohort][ph];return card.mods?Object.assign({cover:card.cover},card.mods):{cover:card.cover};
}
function ctxFor(life,ph,log){
 const pol=polAt(life.polSched,ph),per=perFor(life,ph);
 return {st:life.st,pr:life.pr,pol,per,ph,
  chg(s,d,l){const b=life.st[s];applyDelta(life.st,{[s]:d});log.push({stat:s,delta:life.st[s]-b,label:l});},
  note(t){log.push({note:t});},u(tag){return rngFor(life.seed,ph,tag)();}};
}
function drawEvents(life,ph){
 const rng=rngFor(life.seed,ph,'ev');const n=ph===3?4:3;
 if(!life.echoSeen)life.echoSeen={};
 const eligibleStories=EVENTS.filter(e=>e.story&&e.ph.includes(ph)&&!life.echoSeen[e.storyKey]&&e.storyCondition(life,ph));
 let story=null;
 if(eligibleStories.length){const total=eligibleStories.reduce((a,e)=>a+e.w,0);let r=rng()*total;story=eligibleStories.find(e=>(r-=e.w)<=0)||eligibleStories[eligibleStories.length-1];}
 let pool=EVENTS.filter(e=>!e.story&&e.ph.includes(ph)).map(e=>({e,w:(e.wph&&e.wph[ph])||e.w}));
 const out=[];const ordinaryCount=story?Math.max(0,n-1):n;
 for(let i=0;i<ordinaryCount&&pool.length;i++){
  const tot=pool.reduce((a,x)=>a+x.w,0);let r=rng()*tot,k=0;
  for(;k<pool.length;k++){r-=pool[k].w;if(r<=0)break;}
  k=Math.min(k,pool.length-1);out.push(pool[k].e);pool.splice(k,1);
 }
 if(story){const slot=Math.floor(rng()*(out.length+1));out.splice(slot,0,story);life.echoSeen[story.storyKey]=true;}
 return out;
}
function widowCheck(life,ph){
 if(ph<4)return null;const st=life.st,pr=life.pr;if(st.widowed)return null;
 const u=rngFor(life.seed,ph,'widow')();
 const p=pr.g==='F'?(ph===4?.54:.72):(ph===4?.16:.25); /* Calibrated to LASI Wave 1 (2017-18): 54% F vs 16% M widowed at 60+, reaching ~87% F vs ~37% M at 80+ */
 return u<p;
}

/* ---- phase execution ---- */
/* begin: apply actions, return {events, report}. */
function beginPhase(life,actionIds){
 const ph=life.phase,st=life.st;
 const rep={ph,start:snap(st),lines:[],events:[],period:PERIOD[life.pr.cohort][ph]};
 life.cur=rep;life.pendingEvents=drawEvents(life,ph);life.evIdx=0;
 life.actions[ph]=actionIds.slice();
 const pol=polAt(life.polSched,ph),per=perFor(life,ph);
 // policy start-up effects (early investment)
 if(pol.child&&ph<=1&&life.polSched.child!=null){const poor=life.pr.q<=3;const l=[];const c=ctxFor(life,ph,l);c.chg('H',poor?5:3,'Early-Life Investment');c.chg('E',poor?4:2,'Early-Life Investment');rep.lines.push({title:'Policy: Early-Life Investment',log:l});}
 actionIds.forEach((id,k)=>{
  const u=rngFor(life.seed,ph,'form'+k)();
  const r=calc(id,st,life.pr,pol,per,ph,u);const l=[];
  applyDelta(st,r.d);
  for(const s of ['W','H','E','T'])if(Math.abs(r.d[s])>=.05)l.push({stat:s,delta:r.d[s]});
  if(id==='work'&&r.ex.formal)l.push({note:'Formal job. Pension rights grow.'});
  rep.lines.push({title:ACTIONS[id].name,log:l,action:id});
 });
 // period shock
 const card=PERIOD[life.pr.cohort][ph];
 if(card.shock){const l=[];card.shock(ctxFor(life,ph,l));rep.lines.push({title:'Era: '+card.title,log:l,era:true});}
 return {events:life.pendingEvents};
}
function currentEvent(life){return life.pendingEvents[life.evIdx]||null;}
function availChoices(life,ev){
 const ph=life.phase;const c=ctxFor(life,ph,[]);
 return ev.choices.map(ch=>{const a=ch.avail(c);return {label:ch.label,desc:ch.desc,ok:a===true,reason:a===true?'':a};});
}
function resolveEvent(life,choiceIdx){
 const ev=life.pendingEvents[life.evIdx];const ph=life.phase;const l=[];const c=ctxFor(life,ph,l);
 const rec={id:ev.id,name:ev.name,level:ev.level,concept:ev.concept,text:ev.text(c),log:l};
 if(ev.choices){
  let i=choiceIdx==null?0:choiceIdx;
  if(!ev.choices[i]||ev.choices[i].avail(c)!==true)i=ev.choices.findIndex(x=>x.avail(c)===true);
  if(i<0){c.note('No available response; the event passes without a choice.');}else{life.choices[ph+':'+ev.id]=i;rec.choice=ev.choices[i].label;ev.choices[i].apply(c);}
 }else ev.apply(c);
 life.cur.events.push(rec);life.evIdx++;
}
function finishPhase(life){
 const ph=life.phase,st=life.st,pr=life.pr,rep=life.cur;
 const pol=polAt(life.polSched,ph),per=perFor(life,ph);const l=[];const c=ctxFor(life,ph,l);
 // widowhood (structural)
 const wd=widowCheck(life,ph);
 if(wd){st.widowed=true;const F=pr.g==='F';
  st.W=st.W>0?st.W*(F?(pol.girls?.9:.8):.9):st.W;
  c.chg('T',F?-8:-5,'Loss of spouse');c.chg('H',-2,'Grief and strain');
  if(F&&pr.caste&&pr.q<=2&&st.place==='R'&&!pol.girls)c.chg('W',-5,'Dispossession, lost standing');
  rep.widow={F};}
 // old-age income
 if(ph>=4){
  const careNeed=Math.max(0,(55-st.H)*.10)+st.chronic*.8;
  const need=PH[ph].cost+careNeed*(pol.ltc ? .25 : 1); // LTCI covers 75% of the modelled additional care burden, not ordinary living costs.
  const sp=pol.pension?10:2;
  const work=st.H>=45?2.5*(ph===4?1:.3):0;
  const own=20*st.P+sp+work+.12*Math.max(st.W,0);
  const tot=own;
  st.own=own;
  if(ph===4)st.indep=own>=need*INDEP_K;
  let gap=need-own;
  if(gap>0){const fam=Math.min(gap,9*(st.T/100)*(st.widowed?.6:1));gap-=fam;
   if(gap>0){c.chg('W',-gap,'Unmet living costs');c.chg('H',-gap*.5,'Deprivation');}}
  else st.W+=Math.min(-gap,6);
  // direct add of pension flows to W so savers keep value
  rep.income={own,need};
 }else{
  c.chg('W',-PH[ph].cost,'Cost of living');
 }
 // compounding
 const b=st.W;
 if(st.W>0)st.W+=st.W*(.08+.10*Math.min(st.W,100)/100);else st.W+=st.W*.12; // Illustrative per-life-stage returns/debt growth, not annual rates.
 st.W=clamp(st.W,-40,300);
 if(Math.abs(st.W-b)>=.5)l.push({stat:'W',delta:st.W-b,label:b>0?'Returns on assets':'Interest on debt'});
 // health decay
 let dec=PH[ph].decay*(1+.1*st.scars)*(1+.08*st.chronic);
 const dep=(st.W<5?.4:st.W<15?.15:0)+(st.E<25?.1:0)-(st.T>=60?.1:0);
 dec*=1+dep;
 if(pol.ltc&&ph>=3&&st.H<55)dec*=.85;
 if(st.H>0){const bh=st.H;st.H=clamp(st.H-dec,0,100);if(dec>=.5)l.push({stat:'H',delta:st.H-bh,label:'Wear of years'+(dep>.1?' (worse under deprivation)':'')});}
 rep.lines.push({title:'End of phase',log:l});
 // mortality
 const rng=rngFor(life.seed,ph,'mort');const u=rng(),u2=rng();
 if(ph<5){
  let p=PH[ph].haz*Math.exp(-.045*(st.H-50))*(1+.06*st.scars)*(1+.05*st.chronic)*(per.haz||1);
  // Mortality is not directly multiplied by gender or region: those effects are
  // represented only through modeled exposures/resources, avoiding an unsupported
  // universal sex-region mortality claim. Health, scars, chronic conditions and era remain.
  p=Math.min(p,.9);
  if(u<p){st.alive=false;st.deathAge=PH[ph].ages[0]+Math.floor(u2*(PH[ph].ages[1]-PH[ph].ages[0]+1));}
 }else{
  const f=clamp((st.H-8)*.22+(u2-.5)*9-st.chronic*1.0,0,20);
  st.alive=false;st.deathAge=75+Math.round(f);
 }
 rep.end=snap(st);rep.alive=st.alive;rep.deathAge=st.deathAge;
 life.hist.push(snap(st));life.reports.push(rep);
 if(!st.alive||ph===5){life.done=true;}else life.phase++;
 return rep;
}
let INDEP_K=2.5;
function setIndepK(k){INDEP_K=k;}

function runPhase(life,actionIds,chooser){
 const r=beginPhase(life,actionIds);
 let ev;
 while((ev=currentEvent(life))){
  let idx=null;
  if(ev.choices){idx=chooser?chooser(ev,life):(life.choices[life.phase+':'+ev.id]);if(idx==null)idx=0;}
  resolveEvent(life,idx);
 }
 return finishPhase(life);
}

/* ---------- bots ---------- */
const STRATS={
 balanced:{H:1,E:1,W:1,T:.8},
 scholar:{H:.8,E:2.2,W:.8,T:.6},
 secure:{H:1.3,E:.6,W:1.2,T:1},
 anchor:{H:.9,E:.5,W:.8,T:2},
 builder:{H:.6,E:.9,W:2,T:.4},
 healthy:{H:2,E:.4,W:.8,T:.7}
};
function utility(st,w,ph,cost){
 const f=x=>Math.sqrt(clamp(x,0,100)/100)*10;
 const we=ph<=2?w.E:w.E*.2;
 const wl=st.W<cost?2.5:1;
 const fw=st.W<0?st.W*.4:f(Math.min(st.W,100));
 return w.H*f(st.H)+we*f(st.E)+w.T*f(st.T)+w.W*wl*fw+ (ph<=3?3*st.P*w.W:0);
}
function botActions(life,strategy,noise,rng){
 const ph=life.phase,pr=life.pr;const pol=polAt(life.polSched,ph),per=perFor(life,ph);
 const w=STRATS[strategy||'balanced'];const st={...life.st};const acts=[];
 const ids=ph===0?['study','work','health']:Object.keys(ACTIONS);
 for(let k=0;k<PH[ph].ap;k++){
  let best=null,bs=-1e9;
  for(const id of ids){
   if(ph===0&&id==='work'&&pr.q>=3)continue;
   const r=calc(id,st,pr,pol,per,ph,.5);const d={...r.d};
   if(id==='work'&&r.ex.pFormal!=null){d.W=r.ex.incInformal*(1+.6*r.ex.pFormal);d.P=.2*r.ex.pFormal;}
   const s2={...st};applyDelta(s2,d);
   let sc=utility(s2,w,ph,PH[ph].cost+6)-utility(st,w,ph,PH[ph].cost+6);
   if(noise)sc*=1+noise*(rng()-.5)*2;
   if(sc>bs){bs=sc;best=id;}
  }
  acts.push(best);const r=calc(best,st,pr,pol,per,ph,.5);applyDelta(st,r.d);
 }
 return acts;
}
function botLife(pr,seed,polSched,strategy,noise){
 const life=newLife(pr,seed,polSched);const rng=rngFor(seed,99,'bot');
 while(!life.done){
  runPhase(life,botActions(life,strategy,noise,rng),(ev)=>botChoice(ev,life));
 }
 return life;
}
function botChoice(ev,life){
 const av=availChoices(life,ev);
 const pref={famshock:[1,2,0],migrate:[1,0],parentcare:[0,1,2],layoff:[0,1,2],parentdeathc:[0,2,1],expelled:[0,1,2],addiction:[0,1],business:[1,0],sibling:[0,1],kidsedu:[0,1]}[ev.id]||[0,1,2];
 for(const i of pref)if(av[i]&&av[i].ok)return i;
 return 0;
}

/* ---------- summaries ---------- */
function grade(H){
 if(H>=70)return {n:0,label:'Independent'};
 if(H>=55)return {n:1,label:'Assistance required'};
 if(H>=45)return {n:2,label:'Care level 1'};
 if(H>=35)return {n:3,label:'Care level 2'};
 if(H>=25)return {n:4,label:'Care level 3'};
 if(H>=15)return {n:5,label:'Care level 4'};
 return {n:6,label:'Care level 5'};
}
function summarize(life){
 const st=life.st,h=life.hist;const age=st.deathAge;
 const Hs=h.map(x=>x.H);let hly=0;
 for(let i=0;i<life.reports.length;i++){
  const len=PH[i].ages[1]-PH[i].ages[0]+1;let yrs=len;
  if(i===life.reports.length-1&&life.reports[i].deathAge!=null){yrs=Math.max(0,life.reports[i].deathAge-PH[i].ages[0]+1);}
  const h0=h[i].H,h1=h[i+1].H,threshold=55;let fraction=0;
  if(h0>=threshold&&h1>=threshold)fraction=1;
  else if(h0<threshold&&h1<threshold)fraction=0;
  else if(h1!==h0){const cross=clamp((threshold-h0)/(h1-h0),0,1);fraction=h0>=threshold?cross:1-cross;}
  hly+=yrs*fraction;
 }
 let traj='Died before later life';
 if(age>=60){
  const h4=h[5]?h[5].H:Hs[Hs.length-1];
  if(h4>=50&&h[4].H>=55)traj='Successful';else if(h4<25||h[4].H-h4>40)traj='Pathological';else traj='Usual';
 }
 return {age,hly,grade:grade(Hs[Hs.length-1]),traj,indep:st.indep,final:snap(st),hist:h,Hs};
}
const ASPIRATIONS={
 scholar:{name:'The Professional',text:'Skills 55+ and a formal-job pension track by age 39.',strat:'scholar',
  test:l=>l.hist.length>=4&&l.hist[3].E>=55&&l.hist[3].P>=.2},
 secure:{name:'Secure at 75',text:'Reach the 60–74 phase with income covering modelled needs and health at 50+.',strat:'secure',
  test:l=>l.hist.length>=6&&l.st.indep===true&&l.hist[5].H>=50},
 anchor:{name:'Anchor of the Family',text:'Ties 70+ and out of debt at 60.',strat:'anchor',
  test:l=>l.hist.length>=5&&l.hist[4].T>=70&&l.hist[4].W>=0},
 builder:{name:'The Builder',text:'Wealth 100+ by the end of midlife.',strat:'builder',
  test:l=>l.hist.length>=5&&l.hist[4].W>=100},
 healthy:{name:'Long and Well',text:'Live to at least 80 and finish the 60–74 phase with health at 45+.',strat:'healthy',
  test:l=>l.hist.length>=6&&l.st.deathAge>=80&&l.hist[5].H>=45}
};
function odds(pr,asp,polSched,n,seed0){
 let hit=0;const a=ASPIRATIONS[asp];
 for(let i=0;i<n;i++){const l=botLife(pr,'odds'+seed0+'_'+i,polSched,a.strat,.15);if(a.test(l))hit++;}
 return {hit,n,p:hit/n};
}
function counterfactual(life,pr2){
 const l2=newLife(pr2,life.seed,life.polSched);
 for(let ph=0;ph<life.actions.length&&!l2.done;ph++){
  runPhase(l2,life.actions[ph],(ev)=>{const i=life.choices[ph+':'+ev.id];return i==null?0:i;});
 }
 // if the other life outlives the original, continue it with the balanced strategy
 const rng=rngFor(life.seed,98,'cf');
 while(!l2.done)runPhase(l2,botActions(l2,'balanced',0,rng),(ev)=>botChoice(ev,l2));
 return l2;
}
if(typeof module!=='undefined'&&0)module.exports={PH,POLICIES,COHORTS,ACTIONS,EVENTS,PERIOD,ASPIRATIONS,randomProfile,newLife,botLife,botActions,summarize,odds,counterfactual,setIndepK,rngFor,runPhase,calc,polAt,perFor,grade,STRATS};

function statBars(st,before){

/* ---------- charts ---------- */
function lineChart(series,{w=440,h=150,ymax=100,ymin=0,labels=[],fmt=f1}={}){
 const m={l:34,r:84,t:10,b:24},iw=w-m.l-m.r,ih=h-m.t-m.b;

/* range bars per quintile: p10–p90 span, median tick, mean dot; global mean line */
function rangeChart(groups,{w=520,unit='',max=100}={}){

 groups.forEach((r,i)=>{const y=m.t+i*rh+rh/2;
  g+=`<text class="lbl" x="${m.l-8}" y="${y+4}" text-anchor="end">${r.label}</text>`;

  g+=`<line x1="${X(r.med)}" x2="${X(r.med)}" y1="${y-8}" y2="${y+8}" style="stroke:var(--accent)" stroke-width="2"/>`;

 });

}
function stripChart(items,meanV,{w=520,max=60,unit='yrs'}={}){

 for(let t=0;t<=max;t+=10)g+=`<line class="ax" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${h-m.b}" stroke-dasharray="2 3"/><text x="${X(t)}" y="${h-8}" text-anchor="middle">${t}</text>`;
 g+=`<line x1="${X(meanV)}" x2="${X(meanV)}" y1="${m.t}" y2="${h-m.b}" style="stroke:var(--warn)" stroke-width="1.5"/><text x="${X(meanV)}" y="${m.t+8}" style="fill:var(--warn)" text-anchor="${meanV>max*.7?'end':'start'}" dx="${meanV>max*.7?-4:4}">mean ${f1(meanV)}</text>`;
 items.forEach((it,i)=>{const y=m.t+i*rh+rh/2+6;g+=`<text class="lbl" x="${m.l-8}" y="${y+4}" text-anchor="end">${esc(it.name)}</text><rect x="${m.l}" y="${y-6}" width="${X(it.v)-m.l}" height="12" rx="3" style="fill:var(--accent)"/><text x="${X(it.v)+6}" y="${y+4}" class="lbl">${f1(it.v)}</text>`;});

function outcomeImpacts(log){
 const sum={W:0,H:0,E:0,T:0};
 (log||[]).forEach(x=>{if(x.stat&&Object.prototype.hasOwnProperty.call(sum,x.stat))sum[x.stat]+=Number(x.delta)||0;});
 const changed=Object.keys(sum).filter(k=>Math.abs(sum[k])>=.05);
 const max=Math.max(1,...changed.map(k=>Math.abs(sum[k])));
 const names={W:'Wealth',H:'Health',E:'Skills',T:'Ties'};
 const cards=changed.map(k=>`<div class="impact-stat ${k}"><span>${names[k]}</span><b>${sg(sum[k])}</b><div class="impact-track"><i style="--impact-width:${Math.max(8,Math.abs(sum[k])/max*100)}%"></i></div></div>`).join('');
 const reasons=[...new Set((log||[]).filter(x=>x.stat&&x.label).map(x=>x.label))].slice(0,3);
 return `<div class="outcome-wrap"><div class="outcome-lead"><span class="outcome-mark" aria-hidden="true">↗</span><div><strong>Your choice has landed</strong><small>Here's what shifted in the model.</small></div></div>${changed.length?`<div class="impact-grid">${cards}</div>`:'<p class="small muted">This event did not directly change the four tracked measures.</p>'}${reasons.length?`<p class="impact-reasons"><b>What drove it?</b> ${reasons.map(esc).join(' · ')}.</p>`:''}</div>`;
}

 <details class="card"><summary><b>Model notes</b></summary><p class="small muted"><b>Empirical calibration &amp; teaching scope:</b> Key demographic and ageing parameters are anchored to published Indian data: <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9365624/" target="_blank" rel="noopener">LASI Wave 1 (2017–18)</a> for widowhood (54% of women vs. 16% of men aged 60+; 87% vs. 37% at 80+), <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310107/" target="_blank" rel="noopener">chronic condition prevalence</a> (32.7% hypertension, 14.2% diabetes), and low baseline pension coverage (~22%); <a href="https://data.who.int/countries/356" target="_blank" rel="noopener">WHO India (2023)</a> for life expectancy (71.0 years) vs. healthy life expectancy (60.6 years); and <a href="https://india.unfpa.org/en/publications/caring-our-elders-institutional-responses-india-ageing-report-2023" target="_blank" rel="noopener">UNFPA India Ageing Report 2023</a> for 2050 ageing projections (20.8% aged 60+, 279% growth in 80+). Wealth, health, skills and ties remain abstract teaching-model points rather than rupees or clinical scores.</p><p class="small"><b>Recovery:</b> Game progress is autosaved in this browser tab and restored after a reload, so an image-permission or preview refresh should not return you to the home screen. If a remote photo is blocked, only that image is removed; the game continues. No browser-permission API is called by the game code.</p><p class="small"><b>Photo matching:</b> Event and household images are explicitly mapped, never chosen by broad keyword matching. A photo appears with its event and may reappear in the final Life Album only if it represents a distinct recorded turning point; within that album, the same image is not repeated. Missing or blocked photos are removed without interrupting play. All photos are illustrative, not depictions of a player’s household.</p><p class="small"><b>Home-screen photo credits:</b> <a href="https://www.audaciousproject.org/grantees/jan-sahas" target="_blank" rel="noopener">Jan Sahas / The Audacious Project</a> (family); <a href="https://www.deccanherald.com/india/karnataka/bengaluru/bbmp-to-start-survey-of-street-vendors-soon-2-3113592" target="_blank" rel="noopener">Deccan Herald</a> (street-vending scene); <a href="https://www.all-about-photo.com/images/photographer/G/PHOT-aparna-gautam-12.webp" target="_blank" rel="noopener">Aparna Gautam / All About Photo</a> (urban-market scene).</p><p class="small"><b>Historical references:</b> <a href="https://www.who.int/news-room/questions-and-answers/item/smallpox" target="_blank" rel="noopener">WHO: smallpox eradication</a>; <a href="https://india.unfpa.org/en/publications/caring-our-elders-institutional-responses-india-ageing-report-2023" target="_blank" rel="noopener">UNFPA India: India Ageing Report 2023</a>.</p></details>`;
}

function householdPhoto(pr){const key=HOUSEHOLD_PHOTOS[pr&&pr.house];return key?PHOTO_ASSETS[key]||null:null;}
function householdPhotoMarkup(pr){const p=householdPhoto(pr);if(!p)return '';return `<figure class="household-figure"><img class="life-photo" src="${esc(p.src)}" alt="${esc(p.alt)}" loading="eager" decoding="async" referrerpolicy="no-referrer" onerror="photoFailed(this)"><figcaption class="photo-credit">Photo: <a href="${esc(p.href)}" target="_blank" rel="noopener noreferrer">${esc(p.credit)}</a> · illustrative context</figcaption></figure>`;}
function eventPhoto(ev,pr){let key=EVENT_PHOTOS[ev&&ev.id];if(ev&&ev.id==='famshock'){const rural=pr&&['farm','lease','coast','remote','dairy','orchard','forest','canal','brick','smallholding','landdispute','floodplain','hillroad'].includes(pr.house);key=rural?'farmDrought':(pr&&['marketstall','trader','repair','smallbusiness'].includes(pr.house)?'kirana':'cityMarket');}if(ev&&ev.id==='disaster'){key=pr&&['floodplain','coast','fisherinland'].includes(pr.house)?'floodField':'farmDrought';}if(ev&&ev.id==='cropprice'){key=pr&&['farm','lease','dairy','orchard','canal','smallholding','cooperative','landdispute'].includes(pr.house)?'harvestFarm':'kirana';}const a=key?PHOTO_ASSETS[key]:null;if(!a)return null;return {...a,caption:EVENT_CAPTIONS[ev.id]||''};}
function eventPhotoMarkup(ev,pr){const p=eventPhoto(ev,pr);if(!p)return '';return `<figure class="event-figure"><div class="event-scene"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="eager" decoding="async" referrerpolicy="no-referrer" onerror="photoFailed(this)"><span class="scene-caption">${esc(p.caption)}</span></div><figcaption class="photo-source">Photo: <a href="${esc(p.href)}" target="_blank" rel="noopener noreferrer">${esc(p.credit)}</a> · illustrative, not a depiction of this simulated household</figcaption></figure>`;}

function birth(){

 const o=p.odds;
 return topb()+journeyMarkup(0,'Starting point')+`<div class="card fade"><span class="eyebrow">${esc(p.name)} · birth lottery</span><h2>${COHORTS[pr.cohort].label}, ${COHORTS[pr.cohort].tag}</h2>

 <p class="small muted">Estimate from 600 simulated lives per profile using the game’s focused-effort strategy. ${o.you.hit===0?'No simulated run reached the goal; 0% here does not mean success is impossible.':`${o.you.hit} of ${o.you.n} simulated lives reached the goal.`} The comparison profiles change starting circumstances, not your actual future decisions. These are model outputs, not real-world predictions.</p><details class="small muted"><summary>Why might my chance be low?</summary><p>The goal requires several conditions at once. For this dream, the model checks whether you reach old age, have health of at least 50, and have income covering modeled needs. A single failed condition means the run does not count as success.</p></details></div>
 <button class="primary" data-a="birthnext">${S.pi<S.players.length-1?'Pass to next player':'Start the first round'}</button></div>`;
}
function council(){
 const ph=S.round,used=Object.keys(S.polSched).length,left=3-used;
 const cards=Object.entries(POLICIES).map(([k,p])=>{
  const on=S.polSched[k]!=null,expired=k==='child'&&ph>1&&!on;
  return `<div class="card pol ${on?'on':''}"><b>${p.name}</b><span class="small muted">${p.short}</span><span class="tag">${p.target}</span>${on?`<span class="chip good">In force since ${PH[S.polSched[k]].name}</span>`:expired?`<span class="chip bad">Effective window passed</span>`:`<button data-a="enact" data-k="${k}" ${left<=0?'disabled':''}>Enact now · 1 point</button>`}</div>`;}).join('');
 return topb()+journeyMarkup(ph,'Policy council')+`<div class="card fade"><span class="eyebrow">Round ${ph+1} of 6 · ${PH[ph].name} · ages ${PH[ph].ages[0]}–${PH[ph].ages[1]}</span><h2>Policy council</h2>
 <p class="muted small">Policy points left: <b>${left}</b>. Policies affect everyone from the round they begin. Early-Life Investment can only start during childhood or youth; later policies cannot undo earlier losses.</p>
 <div class="grid">${cards}</div><button class="primary" data-a="council-done">Continue to the era card</button></div>`;
}

}

  <div class="legend"><span><i class="sw" style="background:var(--accent);opacity:.4"></i>10th to 90th percentile</span><span>| median</span><span><i class="sw" style="background:var(--ink);border-radius:50%"></i>mean</span></div>
  ${rangeChart(s.groups,{max:100})}
  <p class="small muted">Same strategy for everyone. Gap in mean simulated age at death between the richest and poorest starting fifth: ${f1(s.gapAge)} years. Women ${f1(s.fem)}, men ${f1(s.mal)}.</p>
  <h3>The spread grows with age</h3>
  <div class="grid"><div>${lineChart([{name:'SD',v:s.het.map(x=>x.H),c:'var(--h)'}],{ymax:Math.ceil(Math.max(...s.het.map(x=>x.H))/5)*5||10,labels:['15','25','40','60','75'],fmt:f1,w:400})}<p class="small muted">Spread (SD) of health among people who survived to each checkpoint</p></div>
  <div>${lineChart([{name:'SD',v:s.het.map(x=>x.W),c:'var(--w)'}],{ymax:Math.ceil(Math.max(...s.het.map(x=>x.W))/10)*10||10,labels:['15','25','40','60','75'],fmt:f1,w:400})}<p class="small muted">Spread (SD) of wealth among people who survived to each checkpoint</p></div></div>
  <details><summary class="small">Table view</summary><div class="scroll"><table><tr><th>Group</th><th>n</th><th>Mean simulated age</th><th>Median simulated age</th><th>P10</th><th>P90</th><th>Healthy yrs</th></tr>${s.groups.map(g=>`<tr><td>${g.label}</td><td>${g.n}</td><td>${f1(g.mean)}</td><td>${g.med}</td><td>${g.p10}</td><td>${g.p90}</td><td>${f1(g.hly)}</td></tr>`).join('')}</table></div></details></div>`;
 }
 let tim='';
 if(LAB.timing){
  const T=LAB.timing;
  tim=`<div class="card fade"><span class="eyebrow">Timing experiment · same ${LAB.n.toLocaleString()} births each time</span><h2>Early help or late help?</h2>
  <div class="scroll"><table><tr><th>Scenario</th><th>Mean age</th><th>Healthy yrs</th><th>Q5 minus Q1 healthy yrs</th><th>Gini, healthy yrs</th><th>Income-independent 60+</th></tr>
  ${T.map(t=>`<tr><td>${t.name}</td><td>${f1(t.s.age)}</td><td>${f1(t.s.hly)}</td><td>${f1(t.s.gap)}</td><td>${t.s.gini.toFixed(3)}</td><td>${Math.round(t.s.indep*100)}%</td></tr>`).join('')}</table></div>
  <p class="small muted">These scenarios compare this model's assumptions; they do not estimate real policy effects in India. A policy can change income security without necessarily changing healthy years. The late package starts at age 60; the early package starts at birth.</p></div>`;
 }
 return topb()+`<div class="card fade"><span class="eyebrow">Population Lab</span><h2>Run ${LAB.n.toLocaleString()} lives at once</h2>
 <p class="muted small">Every simulated person uses the same balanced strategy, with a little noise. Outcomes vary with starting circumstances, cohort history and chance. Probabilities and effect sizes are illustrative, not calibrated estimates for India; use the lab to explore model mechanisms, not predict population outcomes.</p>
 <div class="row"><label for="lc">Cohort</label><select id="lc"><option value="">Mixed</option>${Object.entries(COHORTS).map(([k,c])=>`<option value="${k}" ${LAB.cohort===k?'selected':''}>${c.label}</option>`).join('')}</select>
 <label for="ln">Lives</label><select id="ln">${[1000,2500,5000].map(n=>`<option ${n===LAB.n?'selected':''}>${n}</option>`).join('')}</select>
 <label for="la">Policies start at</label><select id="la">${PH.map((p,i)=>`<option value="${i}" ${LAB.at===i?'selected':''}>${p.name}</option>`).join('')}</select></div>
 <div class="grid">${Object.entries(POLICIES).map(([k,p])=>{const expired=k==='child'&&LAB.at>1;return `<label class="card pol ${LAB.pol[k]&&!expired?'on':''}" style="cursor:pointer"><span class="row"><input type="checkbox" data-pol="${k}" ${LAB.pol[k]&&!expired?'checked':''} ${expired?'disabled':''}><b>${p.name}</b></span><span class="small muted">${p.short}</span>${expired?'<span class="tag">Only available from childhood through youth</span>':''}</label>`;}).join('')}</div>
 <div class="row"><button class="primary" data-a="labrun">Run simulation</button><button data-a="labtiming">Compare early package vs late package</button></div></div>${out}${tim}`;
}

/* ---------- controller ---------- */
function view(){
 switch(S.view){
  case 'home':return home();case 'setup':return setup();case 'aspire':return aspire();case 'birth':return birth();
  case 'council':return council();case 'era':return eraScreen();case 'plan':return turnPlan();case 'event':return turnEvent();
  case 'report':return turnReport();case 'summary':return roundSummary();case 'final':return final();case 'lab':return lab();
 }
}
function eraScreen(){
 const life=S.players.find(p=>!p.life.done&&p.life.phase===S.round).life;
 return topb()+journeyMarkup(S.round,'Era preview')+`<div class="card fade"><span class="eyebrow">Round ${S.round+1} · ${PH[S.round].name} · ${yrs(life.pr.cohort,S.round)}</span><h2>History arrives for everyone</h2>${eraCard(life,S.round)}
 <p class="small muted">The same era card applies to all players. What it does to you depends on where you stand.</p><button class="primary" data-a="eradone">Start turns</button></div>`;
}
const SAVE_KEY='boundedAgencyGameStateV5';
function persistState(){
 try {
  const payload=JSON.stringify({S,LAB});
  try{sessionStorage.setItem(SAVE_KEY,payload);}catch(_e){}
  try{localStorage.setItem(SAVE_KEY,payload);}catch(_e){}
 } catch(_e) { /* Storage may be unavailable in some file previews; keep play running. */ }
}
function restoreState(){
 let raw=null;
 try{raw=sessionStorage.getItem(SAVE_KEY);}catch(_e){}
 if(!raw){try{raw=localStorage.getItem(SAVE_KEY);}catch(_e){}}
 if(!raw)return;
 try{
  const saved=JSON.parse(raw);
  if(saved && saved.S && typeof saved.S.view==='string'){
   S=saved.S;
   // Reconnect serialized event IDs to the canonical event definitions so their
   // choice functions remain available after a browser or preview reload.
   (S.players||[]).forEach(player=>{
    const life=player.life;if(!life)return;
    if(Array.isArray(life.pendingEvents)) life.pendingEvents=life.pendingEvents.map(e=>EVENTS.find(def=>def.id===e.id)).filter(Boolean);
   });
   if(saved.LAB && typeof saved.LAB==='object'){
    Object.assign(LAB,saved.LAB);
   }
  }
 }catch(_e){
  // Ignore old/corrupt snapshots rather than block a fresh game.
  S={view:'home'};
 }
}
function render(){persistState();$.innerHTML=view();window.scrollTo(0,0);}
function startTurn(i){S.pi=i;S.chosen=[];S.view='plan';}
function firstActive(){return S.players.findIndex(p=>!p.life.done&&p.life.phase===S.round);}
function act(a,el){
 switch(a){
  case 'home':S={view:'home'};break;
  case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';return;}
  case 'setup':S={view:'setup',n:S.n,names:S.names};break;
  case 'start':{
   saveSetupInputs();
   const n=S.n||3,names=(S.names||[]).map((nm,i)=>nm.trim()||'Player '+(i+1));
   const co=document.getElementById('co').value,seed='g'+Date.now();
   const cohort=co||'ABCD'[Math.floor(rngFor(seed,0,'co')()*4)];
   const householdOrder=shuffledHouseholds(rngFor(seed,0,'households'));
   const players=names.map((nm,i)=>({name:nm,household:S.allocMode==='manual'?(S.manualProfiles[i]?.house||HOUSEHOLD_IDS[i%HOUSEHOLD_IDS.length]):householdOrder[i%householdOrder.length],manualProfile:S.allocMode==='manual'?S.manualProfiles[i]:null}));
   S={view:'aspire',seed,cohort,polSched:{},players,householdOrder,allocMode:S.allocMode||'random',pi:0,round:0,n,names};break;}
  case 'asp':{const p=S.players[S.pi];p.asp=el.dataset.k;
   const pr=randomProfile(rngFor(S.seed,S.pi,'prof'),S.cohort,p.household);
   if(p.manualProfile){pr.q=+p.manualProfile.q;pr.g=p.manualProfile.g;pr.caste=+p.manualProfile.caste;}
   p.life=newLife(pr,S.seed+'#'+S.pi,S.polSched);
   const ps=ASPIRATIONS[p.asp];const you=odds(pr,p.asp,{},600,S.seed);
   const tp=odds({...pr,q:5,place:'U',reg:'S',caste:0},p.asp,{},600,S.seed+'t');
   const bot=odds({...pr,q:1,place:'R',reg:'N',caste:1},p.asp,{},600,S.seed+'b');
   p.odds={you,top:tp,bot};S.view='birth';break;}
  case 'birthnext':if(S.pi<S.players.length-1){S.pi++;S.view='aspire';}else{S.round=0;S.view='council';}break;
  case 'enact':S.polSched[el.dataset.k]=S.round;break;
  case 'council-done':S.view='era';break;
  case 'eradone':startTurn(firstActive());break;
  case 'add':if(S.chosen.length<PH[S.players[S.pi].life.phase].ap)S.chosen.push(el.dataset.k);break;
  case 'rm':S.chosen.splice(+el.dataset.i,1);break;
  case 'lock':{const life=S.players[S.pi].life;beginPhase(life,S.chosen);S.evRes=null;S.view='event';break;}
  case 'evchoice':{const life=S.players[S.pi].life;resolveEvent(life,+el.dataset.i);S.evRes=life.cur.events[life.cur.events.length-1];break;}
  case 'evnext':{const life=S.players[S.pi].life;S.evRes=null;if(!currentEvent(life)){S.rep=finishPhase(life);S.view='report';}break;}
  case 'after':{
   const nxt=S.players.findIndex((q,i)=>i>S.pi&&!q.life.done&&q.life.phase===S.round);
   if(nxt>=0)startTurn(nxt);
   else if(S.players.some(q=>!q.life.done))S.view='summary';else S.view='final';break;}
  case 'nextround':S.round++;S.view='council';
   if(S.round>5||firstActive()<0){S.view='final';}break;
  case 'lab':S.view='lab';break;
  case 'labrun':{readLab();LAB.res=null;const rows=runLab(polFrom(),LAB.n,LAB.cohort);LAB.res={n:LAB.n,stats:labStats(rows)};break;}
  case 'labtiming':{readLab();const n=LAB.n,c=LAB.cohort;const sc=[['No policy',{}],['Early package: early-life investment, universal health cover, girls’ schooling, from birth',{child:0,uhc:0,girls:0}],['Late package: pension, long-term care, health cover, from age 60',{pension:4,ltc:4,uhc:4}]];
   LAB.timing=sc.map(([name,p])=>({name,s:labStats(runLab(p,n,c))}));break;}
 }
 render();
}
function readLab(){const g=id=>document.getElementById(id);if(g('ln'))LAB.n=+g('ln').value;if(g('lc'))LAB.cohort=g('lc').value;if(g('la'))LAB.at=+g('la').value;document.querySelectorAll('[data-pol]').forEach(c=>LAB.pol[c.dataset.pol]=c.checked);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b);});
document.addEventListener('change',e=>{
 if(S.view==='setup'&&['np','allocMode'].includes(e.target.id)){saveSetupInputs();if(e.target.id==='np'){S.n=+e.target.value;}else{S.allocMode=e.target.value;}render();}
 else if(e.target.matches('[data-pol]')){readLab();render();}
 else if(S.view==='lab'&&['ln','lc','la'].includes(e.target.id)){readLab();render();}
});
restoreState();
render();
</script>

</body></html>
